
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galloway | Teaching & Learning Showcase</title>
<style>
:root {
  --teal:#145d60;
  --ink:#213c3e;
  --cream:#f8f7f3;
  --mint:#e2eeea;
}
* {box-sizing:border-box}
body {
  margin:0;
  background:var(--cream);
  color:var(--ink);
  font-family:Arial,Helvetica,sans-serif;
}
header {
  background:var(--mint);
  padding:65px 7%;
}
header small {
  color:var(--teal);
  font-weight:bold;
  letter-spacing:2px;
}
h1 {
  font-size:clamp(32px,5vw,58px);
  max-width:800px;
  margin:18px 0;
}
header p {max-width:650px;line-height:1.6}
main {max-width:1300px;margin:auto;padding:35px 5%}
.filters {margin-bottom:24px}
.filters button {
  border:1px solid #b9ceca;
  background:white;
  border-radius:30px;
  padding:10px 17px;
  margin:4px;
  cursor:pointer;
  color:var(--ink);
}
.filters button.active {
  background:var(--teal);
  color:white;
}
#cards {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:25px;
}
.card {
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 3px 14px #00000010;
}
.photo {
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  display:block;
  background:#e4e9e7;
}
.placeholder {
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:42px;
  color:#8ba5a1;
}
.content {padding:22px}
.level {
  color:var(--teal);
  text-transform:uppercase;
  font-size:11px;
  letter-spacing:1px;
  font-weight:bold;
}
h2 {font-size:21px;line-height:1.3}
.summary {font-size:14px;line-height:1.7}
.tag {
  display:inline-block;
  background:var(--mint);
  color:var(--teal);
  border:0;
  border-radius:20px;
  padding:7px 11px;
  font-size:11px;
  margin:3px;
  cursor:pointer;
}
footer {
  padding:35px;
  text-align:center;
  color:#607775;
}
</style>
</head>
<body>

<header>
  <small>THE GALLOWAY SCHOOL</small>
  <h1>Great Teaching.<br>Meaningful Learning.</h1>
  <p>
    A growing collection of authentic, creative,
    and joyful learning experiences across Galloway.
    Explore how our students and teachers bring
    learning to life.
  </p>
</header>

<main>
  <div class="filters" id="levels"></div>
  <div class="filters" id="tags"></div>
  <section id="cards"></section>
</main>

<footer>
  The Center for Teaching & Learning · The Galloway School
</footer>

<script>
// PASTE YOUR PUBLISHED GOOGLE SHEET CSV URL HERE
const SHEET_CSV_URL = '';

// Starter examples appear until a Sheet is connected.
const starter = [
  {
    title:"Exploring Textile Traditions",
    level:"Middle Learning",
    summary:"Fiber Arts students explored weaving, quilting, preservation, and the chemistry of dyeing through a hands-on museum experience.",
    tags:"Experiential Learning,Arts Integration,Community Connections"
  },
  {
    title:"Spanish Beyond the Classroom",
    level:"Middle Learning",
    summary:"Spanish students visited Plaza Fiesta to practice language skills, explore Hispanic cultures, and interact with local vendors.",
    tags:"Experiential Learning,Cultural Competence,Real-World Application"
  },
  {
    title:"Finding Voice Through Poetry",
    level:"Middle Learning",
    summary:"Eighth graders wrote and performed original poems in a classroom poetry slam celebrating identity, creativity, and student voice.",
    tags:"Student Voice,Creative Expression,Authentic Assessment"
  },
  {
    title:"An Author Brings Stories to Life",
    level:"Early Learning",
    summary:"Author and illustrator Shawn Harris shared his creative process, painting techniques, and storytelling with Early Learners.",
    tags:"Arts Integration,Creative Expression,Community Connections"
  },
  {
    title:"Haunted Houses and Persuasive Writing",
    level:"Early Learning",
    summary:"Third graders planned to explore neighborhood architecture and use descriptive language to design and advertise imaginative haunted houses.",
    tags:"Experiential Learning,Creative Expression,Real-World Application"
  },
  {
    title:"Physics at the Driving Range",
    level:"Upper Learning",
    summary:"Physics students visited Topgolf to investigate kinematics and analyze golf-ball motion in a real-world setting.",
    tags:"Experiential Learning,Real-World Application,Inquiry-Based Learning"
  },
  {
    title:"Spanish in Service of Community",
    level:"Upper Learning",
    summary:"Upper Learning Spanish students volunteered with Sandy Springs Solidarity, communicating with Spanish-speaking visitors.",
    tags:"Service Learning,Cultural Competence,Community Connections"
  }
];

let experiences = starter;
let selectedLevel = "All";
let selectedTag = "All";

function parseCSV(text) {
  const rows=[];
  let row=[],cell="",quoted=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(c==='"'){
      if(quoted && text[i+1]==='"'){
        cell+='"';i++;
      } else quoted=!quoted;
    } else if(c===',' && !quoted){
      row.push(cell);cell="";
    } else if((c==='\n'||c==='\r') && !quoted){
      if(c==='\r'&&text[i+1]==='\n')i++;
      row.push(cell);
      if(row.some(x=>x.trim()))rows.push(row);
      row=[];cell="";
    } else cell+=c;
  }
  row.push(cell);
  if(row.some(x=>x.trim()))rows.push(row);
  if(!rows.length)return [];
  const headers=rows.shift().map(h=>h.trim().toLowerCase());
  return rows.map(r=>{
    const obj={};
    headers.forEach((h,i)=>obj[h]=(r[i]||"").trim());
    return {
      title:obj.title||"",
      level:obj.level||"",
      summary:obj.summary||"",
      image:obj.image||"",
      tags:obj.tags||"",
      publish:obj.publish||"Yes"
    };
  }).filter(x=>x.title &&
    x.publish.toLowerCase()==="yes");
}

function makeButton(label,active,click) {
  const b=document.createElement("button");
  b.textContent=label;
  if(active)b.classList.add("active");
  b.addEventListener("click",click);
  return b;
}

function render() {
  const levels=document.getElementById("levels");
  const tags=document.getElementById("tags");
  const cards=document.getElementById("cards");

  levels.replaceChildren();
  tags.replaceChildren();
  cards.replaceChildren();

  const levelNames=["All","Early Learning",
    "Middle Learning","Upper Learning"];

  levelNames.forEach(l=>{
    levels.appendChild(makeButton(l,l===selectedLevel,()=>{
      selectedLevel=l;render();
    }));
  });

  const tagNames=["All",...new Set(
    experiences.flatMap(e=>
      (e.tags||"").split(",").map(t=>t.trim())
    ).filter(Boolean)
  )].sort((a,b)=>a==="All"?-1:b==="All"?1:a.localeCompare(b));

  tagNames.forEach(t=>{
    tags.appendChild(makeButton(t,t===selectedTag,()=>{
      selectedTag=t;render();
    }));
  });

  const filtered=experiences.filter(e=>
    (selectedLevel==="All"||e.level===selectedLevel) &&
    (selectedTag==="All"||
      (e.tags||"").split(",").map(t=>t.trim())
      .includes(selectedTag))
  );

  filtered.forEach(e=>{
    const card=document.createElement("article");
    card.className="card";

    if(e.image && /^https:\/\//i.test(e.image)){
      const img=document.createElement("img");
      img.className="photo";
      img.src=e.image;
      img.alt=e.title;
      img.loading="lazy";
      card.appendChild(img);
    } else {
      const placeholder=document.createElement("div");
      placeholder.className="photo placeholder";
      placeholder.textContent="✦";
      card.appendChild(placeholder);
    }

    const content=document.createElement("div");
    content.className="content";

    const level=document.createElement("div");
    level.className="level";
    level.textContent=e.level;

    const title=document.createElement("h2");
    title.textContent=e.title;

    const summary=document.createElement("p");
    summary.className="summary";
    summary.textContent=e.summary;

    content.append(level,title,summary);

    (e.tags||"").split(",").map(t=>t.trim())
    .filter(Boolean).forEach(t=>{
      const tag=document.createElement("button");
      tag.className="tag";
      tag.textContent=t;
      tag.onclick=()=>{
        selectedTag=t;
        render();
        window.scrollTo({top:0,behavior:"smooth"});
      };
      content.appendChild(tag);
    });

    card.appendChild(content);
    cards.appendChild(card);
  });

  if(!filtered.length){
    cards.textContent="No experiences match these filters.";
  }
}

async function loadSheet() {
  if(!SHEET_CSV_URL){render();return;}
  try {
    const response=await fetch(SHEET_CSV_URL,{
      cache:"no-store"
    });
    if(!response.ok)throw Error("Sheet unavailable");
    experiences=parseCSV(await response.text());
  } catch(err) {
    console.error(err);
    document.getElementById("cards").textContent =
      "Unable to load the Google Sheet. Check the published CSV URL.";
    return;
  }
  render();
}

loadSheet();
</script>
</body>
</html>
